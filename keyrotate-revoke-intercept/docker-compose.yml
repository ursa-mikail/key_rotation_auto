services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keyrotate
      POSTGRES_PASSWORD: keyrotate
      POSTGRES_DB: keyrotate
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyrotate -d keyrotate"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://keyrotate:keyrotate@postgres:5432/keyrotate?sslmode=disable
      SHARED_DIR: /shared
      PORT: "8080"
      TF_CONFIG_PATH: /tf-config/main.tf
      # N = total keysets generated at genesis. Every one of them
      # rotates on its own random interval in this variant -- there is
      # no static tier.
      KEYSET_COUNT: "50"
      ROTATION_MIN_SECONDS: "3"
      ROTATION_MAX_SECONDS: "20"
      # The background "revoke interceptor": on a tick every
      # REVOKE_INTERCEPT_INTERVAL_SECONDS, with probability
      # REVOKE_INTERCEPT_PROBABILITY, picks ONE uniformly random
      # still-active keyset and revokes it -- independent of, and able
      # to land at any instant relative to, that keyset's own timer.
      # Fires roughly once every ~interval/probability seconds on
      # average (~8.6s at these defaults). Set the probability to 0 to
      # disable revocation entirely.
      REVOKE_INTERCEPT_INTERVAL_SECONDS: "3"
      REVOKE_INTERCEPT_PROBABILITY: "0.35"
      # What happens when a revoke lands, by default at startup --
      # live-toggleable afterward via POST /api/revoke-mode.
      #   true  = REVOKE_AUTO_ROTATE: emergency-rotate immediately,
      #           then resume normal cycling.
      #   false = HALT: permanently stop that keyset, no further
      #           rotation, ever.
      REVOKE_AUTO_ROTATE: "true"
    volumes:
      - shared-data:/shared
      # Read-only mount of the actual .tf file, purely so the backend
      # can serve its source for display in the "tf-config" UI tab --
      # never written to, never touched by the rotation logic.
      - ./terraform/main.tf:/tf-config/main.tf:ro
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  terraform-runner:
    build: ./terraform
    restart: unless-stopped
    # Forced to root so it can reliably write into /shared regardless
    # of which UID the base terraform image defaults to -- the backend
    # container (also root) writes into the same volume, so both sides
    # need matching write access.
    user: "0:0"
    depends_on:
      - backend
    environment:
      SHARED_DIR: /shared
      # Must be small relative to the rotation expiry range (3-20s) --
      # see terraform/apply-loop.sh and the README's timing section.
      POLL_SECONDS: "1"
    volumes:
      - shared-data:/shared
      - tf-state:/work/state

volumes:
  pgdata:
  shared-data:
  tf-state:
